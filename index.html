<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: transparent; 
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            
            /* Создаем сетку на 2 колонки */
            display: grid;
            grid-template-columns: 1fr 1fr;
            
            /* 
               НАСТРОЙКА ГРАНИЦ СЕТКИ: 
               Изменяя эти проценты (vh - высота экрана, vw - ширина), 
               вы двигаете ВЕСЬ блок с ценами разом.
            */
            padding-top: 18vh;    /* Опускаем ниже верхнего заголовка */
            padding-bottom: 12vh; /* Поднимаем выше нижнего мелкого текста */
            padding-left: 20vw;   /* Двигаем левую колонку вправо к линии */
            padding-right: 5vw;   /* Двигаем правую колонку влево от края */
            
            gap: 15vw; /* Расстояние между левой и правой колонкой цен */
        }

        .column {
            display: grid;
            /* Автоматически делим колонку ровно на 4 одинаковые строки */
            grid-template-rows: repeat(4, 1fr); 
            height: 100%;
        }

        .price-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end; 
            /* МАГИЯ ЗДЕСЬ: Автоматически центрирует блок между линиями по вертикали */
            justify-content: center; 
        }

        /* Евро: размер чуть меньше, чтобы помещалось между линиями */
        .price-eur {
            font-size: 32px; 
            font-weight: 600;
            color: #4a4a4a;
            line-height: 1;
        }

        /* Гривны */
        .price-uah {
            font-size: 22px;
            color: #888888;
            margin-top: 4px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="column" id="col-rooms"></div>
    <div class="column" id="col-services"></div>

    <script>
        // Возвращаем простой массив без координат
        const roomPrices = [185, 220, 230, 25];
        const servicePrices = [18, 15, 12, 15];

        function renderPrices(columnId, prices, rate) {
            const column = document.getElementById(columnId);
            column.innerHTML = ''; 
            
            prices.forEach(eur => {
                const uah = Math.round(eur * rate); 
                const eurFormatted = eur.toFixed(2).replace('.', ',');

                const div = document.createElement('div');
                div.className = 'price-box';
                div.innerHTML = `
                    <div class="price-eur">*${eurFormatted} €</div>
                    <div class="price-uah">${uah.toLocaleString('uk-UA')} ₴</div>
                `;
                column.appendChild(div);
            });
        }

        async function updatePrices() {
            try {
                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                const eurRate = data[0].rate;

                renderPrices('col-rooms', roomPrices, eurRate);
                renderPrices('col-services', servicePrices, eurRate);
            } catch (error) {
                console.error('Помилка отримання курсу НБУ:', error);
            }
        }

        updatePrices();
        setInterval(updatePrices, 6 * 60 * 60 * 1000);
    </script>
</body>
</html>
