<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: transparent; 
            display: flex;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 50px; 
        }

        .column {
            position: relative; /* Делаем колонку точкой отсчета для координат */
            width: 45%;
            height: 100%;
        }

        .price-box {
            position: absolute; /* Отвязываем ценники друг от друга */
            right: 0; /* Прижимаем вправо к вертикальной линии */
            display: flex;
            flex-direction: column;
            align-items: flex-end; 
        }

        /* Евро */
        .price-eur {
            font-size: 38px;
            font-weight: 600;
            color: #4a4a4a;
            line-height: 1;
        }

        /* Гривны */
        .price-uah {
            font-size: 26px;
            color: #888888;
            margin-top: 2px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="column" id="col-rooms"></div>

    <div class="column" id="col-services"></div>

    <script>
        // Теперь у каждой цены есть свой параметр top (отступ сверху в пикселях).
        // Цифры ниже выставлены примерно, ты сможешь подогнать их идеально под линии.
        const roomPrices = [
            { eur: 185, top: 110 }, // Apartment 1-bedroom
            { eur: 220, top: 250 }, // Apartment 2-bedroom
            { eur: 230, top: 380 }, // Suite apartment 2-bedroom
            { eur: 25,  top: 520 }  // 1 extra person
        ];

        const servicePrices = [
            { eur: 18, top: 110 }, // Breakfast per person
            { eur: 15, top: 250 }, // Extra charge for animal
            { eur: 12, top: 380 }, // Parking
            { eur: 15, top: 520 }  // Extra cleaning
        ];

        function renderPrices(columnId, items, rate) {
            const column = document.getElementById(columnId);
            column.innerHTML = ''; 
            
            items.forEach(item => {
                const uah = Math.round(item.eur * rate); 
                const eurFormatted = item.eur.toFixed(2).replace('.', ',');

                const div = document.createElement('div');
                div.className = 'price-box';
                // Применяем индивидуальный отступ для каждого блока
                div.style.top = item.top + 'px'; 
                
                div.innerHTML = `
                    <div class="price-eur">*${eurFormatted} €</div>
                    <div class="price-uah">${uah.toLocaleString('uk-UA')} ₴</div>
                `;
                column.appendChild(div);
            });
        }

        async function updatePrices() {
            try {
                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                const eurRate = data[0].rate;

                renderPrices('col-rooms', roomPrices, eurRate);
                renderPrices('col-services', servicePrices, eurRate);
            } catch (error) {
                console.error('Помилка отримання курсу НБУ:', error);
            }
        }

        updatePrices();

        setInterval(updatePrices, 6 * 60 * 60 * 1000);
    </script>
</body>
</html>
