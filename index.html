<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: transparent; 
            position: relative; 
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .price-box {
            position: absolute; 
            display: flex;
            flex-direction: column;
            /* ВАЖНО: Выравниваем текст по левому краю */
            align-items: flex-start; 
        }

        .price-eur { 
            font-size: 32px; 
            font-weight: 600; 
            color: #4a4a4a; 
            line-height: 1; 
            white-space: nowrap; 
        }
        
        .price-uah { 
            font-size: 22px; 
            color: #888888; 
            margin-top: 4px; 
            line-height: 1; 
            white-space: nowrap; 
            /* Если захотите сдвинуть гривны чуть правее, чтобы они были под цифрами, а не под звездочкой, раскомментируйте строку ниже: */
            /* margin-left: 12px; */
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
        const prices = [
            // --- ЛЕВАЯ КОЛОНКА ---
            // left: 39 (ставим старт текста ровно справа от первой линии)
            { eur: 185, top: 31, left: 39 }, 
            { eur: 220, top: 46, left: 39 }, 
            { eur: 230, top: 61, left: 39 }, 
            { eur: 25,  top: 76, left: 39 }, 

            // --- ПРАВАЯ КОЛОНКА ---
            // left: 89 (ставим старт текста ровно справа от второй линии)
            { eur: 18,  top: 31, left: 89 }, 
            { eur: 15,  top: 46, left: 89 }, 
            { eur: 12,  top: 61, left: 89 }, 
            { eur: 15,  top: 76, left: 89 }  
        ];

        const container = document.getElementById('container');

        function renderPrices(rate) {
            container.innerHTML = ''; 
            
            prices.forEach(item => {
                const uah = Math.round(item.eur * rate); 
                const eurFormatted = item.eur.toFixed(2).replace('.', ',');

                const div = document.createElement('div');
                div.className = 'price-box';
                
                div.style.top = item.top + '%';
                div.style.left = item.left + '%';
                
                // ТЕПЕРЬ ТЕКСТ РАСТЕТ ВПРАВО
                div.style.transform = 'translate(0%, -50%)'; 

                div.innerHTML = `
                    <div class="price-eur">*${eurFormatted} €</div>
                    <div class="price-uah">${uah.toLocaleString('uk-UA')} ₴</div>
                `;
                container.appendChild(div);
            });
        }

        async function updatePrices() {
            try {
                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                const eurRate = data[0].rate;
                renderPrices(eurRate);
            } catch (error) {
                console.error('Помилка отримання курсу НБУ:', error);
            }
        }

        updatePrices();
        setInterval(updatePrices, 6 * 60 * 60 * 1000);
    </script>
</body>
</html>
